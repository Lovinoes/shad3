[package]
name = "shad3"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }
futures = "0.3"
# Already part of the build (aws-sdk); checks parts before resuming an upload.
md-5 = "0.11"
mime_guess = "2"
# Without a store feature keyring silently uses an in-memory mock on Linux.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "windows-native"] }

# Already part of Tauri on Linux; used to read the desktop's window button layout.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Already part of the build (keyring); reads the desktop's dark/light preference.
dbus = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
