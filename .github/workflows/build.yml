name: build

# By hand from the Actions tab: packages show up as single-file (not zipped) artifacts.
# On a tag like v0.1.0: same, plus a GitHub release with the packages attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "shad3 $GITHUB_REF_NAME" --generate-notes
          # The key that verifies the signed .rpm.
          if [ -f RPM-GPG-KEY-shad3 ]; then gh release upload "$GITHUB_REF_NAME" RPM-GPG-KEY-shad3 --clobber; fi

  build:
    needs: release
    # Still runs when `release` was skipped (not a tag).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the .deb and AppImage compatible with older glibc.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Signs the .rpm when the RPM_SIGNING_KEY secret is set; unsigned otherwise. One-time setup:
      #   gpg --quick-gen-key "shad3 packages" rsa4096 sign never
      #   secret RPM_SIGNING_KEY = gpg --export-secret-keys -a "shad3 packages"
      #   secret RPM_SIGNING_PASSPHRASE = its passphrase
      #   commit the public key: gpg --export -a "shad3 packages" > RPM-GPG-KEY-shad3
      - name: RPM signing key
        if: runner.os == 'Linux'
        env:
          KEY: ${{ secrets.RPM_SIGNING_KEY }}
          PASS: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$KEY" ]; then
            { echo "TAURI_SIGNING_RPM_KEY<<END_OF_KEY"; echo "$KEY"; echo "END_OF_KEY"; } >> "$GITHUB_ENV"
            if [ -n "$PASS" ]; then echo "TAURI_SIGNING_RPM_KEY_PASSPHRASE=$PASS" >> "$GITHUB_ENV"; fi
          else
            echo "::warning::RPM_SIGNING_KEY is not set, the .rpm is unsigned"
          fi

      - name: Build (x64)
        shell: bash
        run: |
          target=$([ "$RUNNER_OS" = Windows ] && echo x86_64-pc-windows-msvc || echo x86_64-unknown-linux-gnu)
          npx tauri build --target "$target" --bundles ${{ matrix.bundles }}
          mkdir out
          cp src-tauri/target/*/release/bundle/*/*.{deb,rpm,AppImage,exe,msi} out/ 2>/dev/null || true
          ls out

      # Unzipped artifacts take one file each.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: out/*.rpm, archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: out/*.deb, archive: false, if-no-files-found: error }
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: { path: out/*.AppImage, archive: false, if-no-files-found: error }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with: { path: out/*.exe, archive: false, if-no-files-found: error }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with: { path: out/*.msi, archive: false, if-no-files-found: error }

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
